name: 功能建议
description: 想要新的文件名格式、发送节奏或开关
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先翻翻已有 Issue；建议只涉及发送时的消息组织方式，不涉及自动操作或账号数据。

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: 建议前确认
      options:
        - label: 我已知悉本模块会 Hook 微信，风险由我自行承担。
          required: true
        - label: 我的建议不涉及自动化操作、不采集或修改账号数据。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 什么场景不顺手
      description: 先说场景再说想法——在哪一步、现在是什么样、想变成什么样。
      placeholder: |
        例：
        一次发 20 张图时，引用条太多把聊天记录刷屏；
        希望能只对前 N 张补文字。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的效果（可选）
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
    validations:
      required: false
