name: CI

# 只在开 PR 或手动触发时跑；推分支不自动构建（日常本地 build.cmd + 真机验证完才提交）。
# 门禁 job 是硬性的；build job 用 ubuntu runner 自己装 SDK，用来确认代码能编过。

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: 文档与凭据门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 文档门禁
        run: python tools/check-docs.py
      - name: 凭据门禁
        run: python tools/check-secrets.py

  build:
    name: 构建 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: gates
    env:
      # runner 镜像自带 Android SDK；显式指过去，Gradle 才能在没有 local.properties 时找到它。
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 SDK 组件
        shell: bash
        run: |
          # 不再用 android-actions/setup-android@v3：它默认安装 "tools" 包，
          # 而该包已从 SDK 仓库下架，job 会死在 setup 阶段（Failed to find package 'tools'）。
          # 直接调镜像预置的 sdkmanager 装本项目要的 compileSdk 平台与 build-tools。
          SDKM="$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          echo "sdkmanager=$SDKM"
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          # compileSdk = 37，仓库里的包名带小版本号：platforms;android-37.0
          "$SDKM" --install "platforms;android-37.0" "build-tools;35.0.0" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"
      - name: 构建
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
